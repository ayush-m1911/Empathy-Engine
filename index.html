<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Empathy Engine – AI that speaks with emotion. Enter your text and hear it expressed with human-like emotional depth." />
  <title>Empathy Engine – AI That Speaks with Emotion</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Animated background blobs -->
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="container">

    <!-- ── Header ── -->
    <header class="header">
      <div class="logo-badge" aria-hidden="true">🧠</div>
      <h1 class="title">Empathy Engine</h1>
      <p class="subtitle">AI that speaks with emotion</p>
    </header>

    <!-- ── Voice Selection Card ── -->
    <section class="card voice-card" aria-label="Voice Selection">
      <div class="voice-card-header">
        <span class="input-label"><span class="label-icon">🎤</span> Choose a Voice</span>
        <span class="voice-selected-badge" id="voiceSelectedBadge">Sarah</span>
      </div>
      <div class="voice-grid" id="voiceGrid" role="listbox" aria-label="Voice options"></div>
    </section>

    <!-- ── Input Card ── -->
    <section class="card input-card" aria-label="Text Input">
      <label for="userText" class="input-label">
        <span class="label-icon">✍️</span> Your Message
      </label>
      <div class="textarea-wrapper">
        <textarea
          id="userText"
          class="text-input"
          placeholder="Type your message here..."
          maxlength="500"
          rows="5"
          spellcheck="true"
          aria-label="Enter text to convert to emotional voice"
        ></textarea>
        <span class="char-counter"><span id="charCount">0</span> / 500</span>
      </div>

      <button id="submitBtn" class="submit-btn" aria-label="Generate Emotional Voice">
        <span class="btn-icon" aria-hidden="true">🎙️</span>
        <span class="btn-text">Generate Emotional Voice</span>
        <span class="spinner" id="spinner" aria-hidden="true"></span>
      </button>
    </section>

    <!-- ── Result Card ── -->
    <section class="card result-card hidden" id="resultCard" aria-live="polite" aria-label="Emotion Analysis Result">

      <div class="result-header">
        <span class="result-label">Emotion Detected</span>
        <span class="result-voice-tag" id="resultVoiceTag">🎤 Sarah</span>
      </div>

      <!-- Emotion Display (primary + secondary) -->
      <div class="emotion-display" id="emotionDisplay">
        <!-- Primary -->
        <div class="emotion-primary">
          <span class="emotion-emoji" id="emotionEmoji" aria-hidden="true">😐</span>
          <div class="emotion-text">
            <span class="emotion-name" id="emotionName">neutral</span>
            <span class="emotion-pct" id="emotionPct"></span>
          </div>
        </div>
        <!-- Divider + Secondary (hidden until we have one) -->
        <div class="emotion-secondary hidden" id="emotionSecondary">
          <span class="emotion-divider" aria-hidden="true">+</span>
          <span class="emotion-emoji-sm" id="secondaryEmoji" aria-hidden="true"></span>
          <div class="emotion-text">
            <span class="emotion-name-sm" id="secondaryName"></span>
            <span class="emotion-pct-sm" id="secondaryPct"></span>
          </div>
        </div>
      </div>

      <!-- Intensity Bar -->
      <div class="intensity-section">
        <div class="intensity-header">
          <span class="intensity-label">Intensity</span>
          <span class="intensity-value" id="intensityValue">0%</span>
        </div>
        <div class="intensity-bar-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="intensityBar">
          <div class="intensity-bar-fill" id="intensityFill"></div>
        </div>
      </div>

      <!-- Audio Player -->
      <div class="audio-section" id="audioSection">
        <span class="audio-label">🔊 Generated Voice</span>
        <audio
          id="audioPlayer"
          controls
          class="audio-player"
          aria-label="Generated emotional voice audio"
        ></audio>
      </div>

    </section>

    <!-- ── Error Card ── -->
    <div class="error-toast hidden" id="errorToast" role="alert" aria-live="assertive">
      <span class="error-icon" aria-hidden="true">⚠️</span>
      <span id="errorMessage">Something went wrong. Please try again.</span>
      <button class="error-close" id="closeError" aria-label="Close error">✕</button>
    </div>

    <!-- ── Footer ── -->
    <footer class="footer">
      <p>Powered by <strong>Empathy Engine</strong> · Emotional AI Speech Synthesis</p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
